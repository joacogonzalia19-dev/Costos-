<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Costos-</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Costos-</h1>
  </header>

  <main>
    <section id="settings-section" class="card">
      <h2>Ajustes por defecto</h2>
      <p class="muted">
        Se aplican a todos los productos que no tengan su propio ajuste particular.
      </p>
      <form id="settings-form" class="settings-grid">
        <label>
          Comisión de pago (%)
          <input type="number" step="0.01" min="0" id="paymentFeePct" />
        </label>
        <label>
          Impuestos (%)
          <input type="number" step="0.01" min="0" id="taxPct" />
        </label>
        <label>
          Costos fijos / publicidad (%)
          <input type="number" step="0.01" min="0" id="fixedCostPct" />
        </label>
        <label>
          Margen deseado (%)
          <input type="number" step="0.01" min="0" id="marginPct" />
        </label>
        <button type="submit">Guardar ajustes</button>
      </form>
    </section>

    <section id="add-product-section" class="card">
      <h2>Agregar producto</h2>
      <form id="add-product-form" class="add-product-grid">
        <label>
          Nombre
          <input type="text" id="new-name" required />
        </label>
        <label>
          Costo
          <input type="number" step="0.01" min="0" id="new-cost" required />
        </label>
        <label>
          Envío/empaque
          <input type="number" step="0.01" min="0" id="new-shipping" />
        </label>
        <button type="submit">Agregar</button>
      </form>
    </section>

    <section class="card">
      <h2>Productos</h2>
      <div id="products-table-wrapper">
        <table id="products-table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Costo</th>
              <th>Envío</th>
              <th>Precio sugerido</th>
              <th>Margen neto</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="products-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
